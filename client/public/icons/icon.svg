<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Angels & Bandits app icon (M2): the biplane, top-down and nose-up, over
       a night skyline. Hand-drawn source of every PNG in this folder —
       tools/icons/render-icons.mjs rasterises it. Full-bleed and opaque (iOS
       renders transparency black); the plane stays inside the central 80%
       circle, so the same art doubles as the maskable icon. -->
  <rect width="512" height="512" fill="#141225" />
  <circle cx="256" cy="236" r="190" fill="#1d1a38" />
  <g fill="#0c0b18">
    <rect x="0" y="380" width="58" height="132" />
    <rect x="52" y="342" width="44" height="170" />
    <rect x="90" y="402" width="70" height="110" />
    <rect x="154" y="360" width="38" height="152" />
    <rect x="320" y="372" width="40" height="140" />
    <rect x="354" y="330" width="56" height="182" />
    <rect x="404" y="396" width="50" height="116" />
    <rect x="448" y="352" width="64" height="160" />
  </g>
  <g fill="#ffc46b">
    <rect x="64" y="360" width="8" height="10" />
    <rect x="78" y="388" width="8" height="10" />
    <rect x="166" y="380" width="8" height="10" />
    <rect x="368" y="350" width="8" height="10" />
    <rect x="388" y="378" width="8" height="10" />
    <rect x="466" y="372" width="8" height="10" />
  </g>
  <g fill="#27e0c0" stroke="#0c0b18" stroke-width="6" stroke-linejoin="round">
    <!-- tailplane, fuselage, upper wing (back to front) -->
    <rect x="186" y="352" width="140" height="34" rx="12" />
    <path d="M230 130 Q256 106 282 130 L272 394 Q256 412 240 394 Z" />
    <rect x="76" y="176" width="360" height="62" rx="24" />
  </g>
  <g fill="#ff7a9a">
    <rect x="86" y="188" width="34" height="38" rx="10" />
    <rect x="392" y="188" width="34" height="38" rx="10" />
  </g>
  <!-- propeller disc -->
  <ellipse
    cx="256"
    cy="116"
    rx="54"
    ry="9"
    fill="#e8f6fa"
    fill-opacity="0.75"
    stroke="#0c0b18"
    stroke-width="4"
  />
</svg>
