<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Angels &amp; Bandits</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #141225;
        cursor: crosshair;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      canvas {
        display: block;
      }
      #hud {
        position: fixed;
        left: 16px;
        bottom: 14px;
        color: #9fd8e8;
        font-size: 13px;
        line-height: 1.5;
        text-shadow: 0 1px 2px #000;
        user-select: none;
        pointer-events: none;
      }
      /* Gun-line pipper (ANGE-G9CPCV, Concept 1 "Classic Gunsight"). PROJECTED,
         not pinned: the chase camera looks ~10 degrees below the plane's forward
         vector, so a centred crosshair points nowhere near where the bullets
         actually go. ui/lead.ts drives the transform; left/top stay at the
         origin and the negative margin re-centres the 48px box, same as #lead. */
      #crosshair {
        position: fixed;
        left: 0;
        top: 0;
        width: 48px;
        height: 48px;
        margin: -24px 0 0 -24px;
        display: none;
        color: #9fd8e8cc;
        pointer-events: none;
        will-change: transform;
      }
      #crosshair .ring {
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
      }
      #crosshair .tick {
        stroke: currentColor;
        stroke-width: 1.5;
        opacity: 0.8;
      }
      #crosshair .dot {
        fill: currentColor;
      }
      #fade {
        position: fixed;
        inset: 0;
        background: #000;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.7s ease-out;
      }
      #fade.dead {
        transition: none;
        opacity: 1;
      }
      #crosshair.hit {
        color: #ffc46b;
        filter: drop-shadow(0 0 8px #ffc46b);
      }
      /* Hitmarker (approved concept 1 "Classic Cross"): four X-strokes snap
         in at the reticle on a local connect, fading out over 120 ms once
         released; a kill swaps to a larger pink X held ~400 ms. */
      #hitmarker {
        position: fixed;
        left: 0;
        top: 0;
        width: 0;
        height: 0;
        opacity: 0;
        transition: opacity 0.12s linear;
        pointer-events: none;
        user-select: none;
        will-change: transform;
      }
      #hitmarker.on {
        opacity: 1;
        transition: none;
      }
      #hitmarker span {
        position: absolute;
        width: 2px;
        height: 9px;
        background: #ffc46b;
        box-shadow: 0 0 6px #ffc46b;
      }
      #hitmarker span:nth-child(1) {
        transform: translate(-7px, -13px) rotate(-45deg);
      }
      #hitmarker span:nth-child(2) {
        transform: translate(5px, -13px) rotate(45deg);
      }
      #hitmarker span:nth-child(3) {
        transform: translate(-7px, 3px) rotate(45deg);
      }
      #hitmarker span:nth-child(4) {
        transform: translate(5px, 3px) rotate(-45deg);
      }
      #hitmarker.kill span {
        height: 14px;
        background: #ff7a9a;
        box-shadow: 0 0 9px #ff7a9a;
      }
      #hitmarker.kill span:nth-child(1) {
        transform: translate(-10px, -19px) rotate(-45deg);
      }
      #hitmarker.kill span:nth-child(2) {
        transform: translate(8px, -19px) rotate(45deg);
      }
      #hitmarker.kill span:nth-child(3) {
        transform: translate(-10px, 5px) rotate(45deg);
      }
      #hitmarker.kill span:nth-child(4) {
        transform: translate(8px, 5px) rotate(-45deg);
      }
      body.freelook #hitmarker {
        opacity: 0.3;
      }
      #gauges {
        position: fixed;
        right: 16px;
        bottom: 14px;
        width: 180px;
        pointer-events: none;
        user-select: none;
      }
      .gauge {
        margin-top: 8px;
      }
      .gauge label {
        display: block;
        color: #9fd8e8;
        font-size: 10px;
        letter-spacing: 0.15em;
        margin-bottom: 3px;
        text-shadow: 0 1px 2px #000;
      }
      .gauge .bar {
        height: 6px;
        background: #0c0b18cc;
        border: 1px solid #27e0c055;
      }
      .gauge .fill {
        height: 100%;
        width: 100%;
        background: #27e0c0;
        transition: width 0.12s linear;
      }
      #heat-fill {
        background: #ffc46b;
      }
      #heat.locked .fill {
        background: #ff7a9a;
      }
      #heat.locked label {
        color: #ff7a9a;
      }
      #protected-badge {
        display: none;
        color: #9fd8e8;
        font-size: 11px;
        letter-spacing: 0.2em;
        margin-top: 8px;
        text-align: right;
        animation: prot-pulse 0.4s ease-in-out infinite alternate;
      }
      #protected-badge.on {
        display: block;
      }
      @keyframes prot-pulse {
        from {
          opacity: 0.35;
        }
        to {
          opacity: 1;
        }
      }
      #freelook-hint {
        position: fixed;
        left: 50%;
        top: 14px;
        transform: translateX(-50%);
        display: none;
        color: #9fd8e8;
        font-size: 11px;
        letter-spacing: 0.2em;
        text-shadow: 0 1px 2px #000;
        opacity: 0.65;
        pointer-events: none;
        user-select: none;
      }
      body.freelook #freelook-hint {
        display: block;
      }
      /* Aim chrome is meaningless mid-orbit — dim it to ~30%. */
      body.freelook #crosshair,
      body.freelook #lead {
        opacity: 0.3;
      }
      /* Zoomed, the pipper IS the gunsight — brighten and thicken it. */
      body.zoom #crosshair {
        color: #ffd9a0;
      }
      body.zoom #crosshair .ring {
        stroke-width: 2;
      }
      body.zoom #crosshair .tick {
        opacity: 1;
      }
      #killfeed {
        position: fixed;
        top: 14px;
        right: 16px;
        text-align: right;
        pointer-events: none;
        user-select: none;
        color: #e8f6fa;
        font-size: 13px;
        line-height: 1.7;
        text-shadow: 0 1px 2px #000;
      }
      #killfeed .entry {
        opacity: 1;
        transition: opacity 1s ease-out;
      }
      #killfeed .entry.fading {
        opacity: 0;
      }
      #killfeed .killer {
        color: #27e0c0;
      }
      #killfeed .victim {
        color: #ff7a9a;
      }
      #comms {
        position: fixed;
        top: 158px;
        right: 16px;
        text-align: right;
        pointer-events: none;
        user-select: none;
        color: #9fd8e8;
        font-size: 12px;
        line-height: 1.7;
        text-shadow: 0 1px 2px #000;
      }
      #comms .entry {
        opacity: 0.9;
        transition: opacity 1s ease-out;
      }
      #comms .entry.fading {
        opacity: 0;
      }
      #comms .speaker {
        color: #ffc46b;
      }
      #radio-toggle {
        margin-top: 8px;
        color: #9fd8e8;
        font-size: 10px;
        letter-spacing: 0.15em;
        text-align: right;
        cursor: pointer;
        pointer-events: auto;
        user-select: none;
      }
      #radio-toggle.off {
        color: #5a6b78;
      }
      #scoreboard {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        display: none;
        background: #0c0b18e6;
        border: 1px solid #27e0c0;
        color: #e8f6fa;
        padding: 18px 26px;
        min-width: 320px;
        pointer-events: none;
        user-select: none;
      }
      #scoreboard.open {
        display: block;
      }
      #scoreboard h2 {
        margin: 0 0 10px;
        font-size: 13px;
        letter-spacing: 0.25em;
        color: #9fd8e8;
        text-align: center;
      }
      #scoreboard table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      #scoreboard th,
      #scoreboard td {
        padding: 3px 10px;
        text-align: right;
      }
      #scoreboard th:first-child,
      #scoreboard td:first-child {
        text-align: left;
      }
      #scoreboard th {
        color: #9fd8e8;
        font-weight: normal;
        font-size: 10px;
        letter-spacing: 0.15em;
      }
      #scoreboard tr.self td {
        color: #27e0c0;
      }
      #scoreboard tr.bot td {
        color: #ffa26b;
      }
      /* Shared bot-count control (approved concept 2 "Segment Bar"): eleven
         notches under the roster, one per bot seat, filled in the same orange
         the bot rows use — the bar literally counts the BANDIT rows the room
         will hold. The panel itself is pointer-events:none, so the control
         opts back in; without that the cells can't be clicked. */
      #bots-control {
        margin-top: 14px;
        padding-top: 12px;
        border-top: 1px solid #27e0c033;
        pointer-events: auto;
      }
      #bots-control .head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 6px;
      }
      #bots-control .head label {
        color: #9fd8e8;
        font-size: 10px;
        letter-spacing: 0.15em;
      }
      #bots-value {
        color: #ffa26b;
      }
      #bots-by {
        color: #ffc46b;
        font-size: 10px;
        opacity: 0.8;
      }
      #bots-cells {
        display: flex;
        gap: 3px;
        cursor: pointer;
      }
      #bots-cells .cell {
        flex: 1;
        height: 14px;
        background: #0c0b18;
        border: 1px solid #27e0c033;
      }
      #bots-cells .cell.filled {
        background: #ffa26b;
        border-color: #ffa26b;
        box-shadow: 0 0 5px #ffa26b55;
      }
      #bots-control .scale {
        display: flex;
        justify-content: space-between;
        margin-top: 3px;
        font-size: 9px;
        letter-spacing: 0.1em;
        color: #9fd8e8;
        opacity: 0.55;
      }
      #killcam {
        position: fixed;
        left: 50%;
        top: 32%;
        transform: translateX(-50%);
        display: none;
        color: #ff7a9a;
        font-size: 20px;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        text-align: center;
        text-shadow: 0 1px 6px #000;
        pointer-events: none;
        user-select: none;
      }
      #killcam.open {
        display: block;
      }
      #join {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: #141225ee;
        cursor: default;
      }
      #join.open {
        display: flex;
      }
      #join form {
        text-align: center;
        color: #9fd8e8;
      }
      #join h1 {
        font-size: 22px;
        letter-spacing: 0.2em;
        margin: 0 0 18px;
      }
      #join input {
        background: #0c0b18;
        border: 1px solid #27e0c0;
        color: #e8f6fa;
        font: inherit;
        font-size: 16px;
        padding: 10px 14px;
        text-align: center;
        outline: none;
        width: 220px;
      }
      /* Submit only — a bare `#join button` would also hit #join-fs and
         out-specify .fs-toggle (the solid-teal-block bug). */
      #join button[type="submit"] {
        display: block;
        margin: 14px auto 0;
        background: #27e0c0;
        border: none;
        color: #0c0b18;
        font: inherit;
        font-size: 14px;
        letter-spacing: 0.15em;
        padding: 9px 26px;
        cursor: pointer;
      }
      #join-status {
        min-height: 1.2em;
        margin: 12px 0 0;
        font-size: 12px;
        color: #ff7a9a;
      }
      #minimap {
        position: fixed;
        left: 16px;
        top: 14px;
        width: 160px;
        height: 160px;
        border: 1px solid #27e0c055;
        background: #0d0c1a;
        opacity: 0.88;
        pointer-events: none;
        user-select: none;
      }
      .edge-marker {
        position: fixed;
        left: 0;
        top: 0;
        width: 0;
        height: 0;
        border-left: 7px solid transparent;
        border-right: 7px solid transparent;
        border-bottom: 12px solid #ff8a3d;
        filter: drop-shadow(0 0 3px #ff8a3d88);
        pointer-events: none;
        user-select: none;
        will-change: transform;
      }
      /* Lead reticle (ANGE-G9CPCV, Concept 1). Dashed while merely tracking,
         solid + filled + glowing once the gun line and the intercept agree —
         a SHAPE change, because brightness alone loses against a bloomed
         facade at BLOOM_THRESHOLD 0.72. */
      #lead {
        position: fixed;
        left: 0;
        top: 0;
        width: 48px;
        height: 48px;
        margin: -24px 0 0 -24px;
        color: #ffc46b;
        display: none;
        pointer-events: none;
        user-select: none;
        will-change: transform;
      }
      #lead .ring {
        fill: none;
        stroke: currentColor;
        stroke-width: 1;
        stroke-dasharray: 3 4;
        opacity: 0.85;
      }
      #lead .core {
        fill: currentColor;
        opacity: 0;
      }
      #lead .brk {
        stroke: currentColor;
        stroke-width: 2;
        opacity: 0;
      }
      #lead.solution {
        color: #fff3d6;
        filter: drop-shadow(0 0 6px #ffc46b);
      }
      #lead.solution .ring {
        stroke-dasharray: none;
        stroke-width: 2;
        opacity: 1;
      }
      #lead.solution .core {
        opacity: 0.55;
      }
      #lead.solution .brk {
        opacity: 0.9;
      }
      /* Fullscreen ghost icon (chosen concept 3): framed-viewport SVG, no
         chrome — ghosted until hover; body.fullscreen swaps in the ×-in-frame
         exit icon. Inline SVG, not a text glyph: U+26F6 falls back to an
         emoji/boxed font on some platforms and rendered as a solid block. */
      .fs-toggle {
        appearance: none;
        -webkit-appearance: none;
        width: 22px;
        height: 22px;
        padding: 0;
        background: transparent;
        border: none;
        color: #9fd8e8;
        opacity: 0.4;
        cursor: pointer;
        transition: opacity 0.15s ease;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }
      .fs-toggle:hover,
      .fs-toggle:active {
        background: transparent;
      }
      .fs-toggle:hover {
        opacity: 1;
      }
      .fs-toggle:focus-visible {
        opacity: 1;
        outline: 1px solid #9fd8e8aa;
        outline-offset: 2px;
        border-radius: 2px;
      }
      .fs-toggle svg {
        display: block;
        width: 100%;
        height: 100%;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        filter: drop-shadow(0 1px 2px #000);
      }
      .fs-toggle .icon-exit {
        display: none;
      }
      body.fullscreen .fs-toggle {
        opacity: 0.55;
      }
      body.fullscreen .fs-toggle:hover {
        opacity: 1;
      }
      body.fullscreen .fs-toggle .icon-enter {
        display: none;
      }
      body.fullscreen .fs-toggle .icon-exit {
        display: block;
      }
      #fs-btn {
        position: fixed;
        right: 16px;
        bottom: 76px;
      }
      #join-fs {
        position: absolute;
        right: 14px;
        top: 12px;
      }

    </style>
  </head>
  <body>
    <svg id="crosshair" viewBox="0 0 48 48" aria-hidden="true">
      <circle class="ring" cx="24" cy="24" r="7" />
      <circle class="dot" cx="24" cy="24" r="1.2" />
      <line class="tick" x1="24" y1="11" x2="24" y2="15" />
      <line class="tick" x1="24" y1="33" x2="24" y2="37" />
      <line class="tick" x1="11" y1="24" x2="15" y2="24" />
      <line class="tick" x1="33" y1="24" x2="37" y2="24" />
    </svg>
    <div id="hitmarker"><span></span><span></span><span></span><span></span></div>
    <svg id="lead" viewBox="0 0 48 48" aria-hidden="true">
      <circle class="core" cx="24" cy="24" r="10" />
      <circle class="ring" cx="24" cy="24" r="10" />
      <line class="brk" x1="24" y1="6" x2="24" y2="10" />
      <line class="brk" x1="24" y1="38" x2="24" y2="42" />
      <line class="brk" x1="6" y1="24" x2="10" y2="24" />
      <line class="brk" x1="38" y1="24" x2="42" y2="24" />
    </svg>
    <canvas id="minimap" width="320" height="320"></canvas>
    <div id="hud"></div>
    <div id="gauges">
      <div class="gauge" id="hp">
        <label for="hp-fill">HULL</label>
        <div class="bar"><div class="fill" id="hp-fill"></div></div>
      </div>
      <div class="gauge" id="heat">
        <label for="heat-fill">GUNS</label>
        <div class="bar"><div class="fill" id="heat-fill"></div></div>
      </div>
      <div id="protected-badge">◇ PROTECTED ◇</div>
      <div id="radio-toggle"></div>
    </div>
    <button
      id="fs-btn"
      class="fs-toggle"
      title="Fullscreen (F)"
      aria-label="Toggle fullscreen"
    >
      <svg class="icon-enter" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="7" y="7" width="10" height="10" stroke-width="1.6" />
        <path d="M3 7V3h4M17 3h4v4M21 17v4h-4M7 21H3v-4" />
      </svg>
      <svg class="icon-exit" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="7" y="7" width="10" height="10" stroke-width="1.6" />
        <path d="M9.6 9.6l4.8 4.8M14.4 9.6l-4.8 4.8" stroke-width="1.6" />
      </svg>
    </button>
    <div id="freelook-hint">◇ FREE LOOK ◇</div>
    <div id="killfeed"></div>
    <div id="comms"></div>
    <div id="scoreboard">
      <h2>SCOREBOARD</h2>
      <table>
        <thead>
          <tr><th>PILOT</th><th>KILLS</th><th>DEATHS</th></tr>
        </thead>
        <tbody id="scoreboard-rows"></tbody>
      </table>
      <div id="bots-control">
        <div class="head">
          <label for="bots-cells">BOTS: <span id="bots-value">5</span></label>
          <span id="bots-by"></span>
        </div>
        <!-- Cells are built by ui/scoreboard.ts (one per seat, count from
             BOT_TARGET_MAX). tabindex=-1: focus must never land here, or the
             flight keys would type into the page instead of flying. -->
        <div
          id="bots-cells"
          role="slider"
          tabindex="-1"
          aria-label="Bots in this room"
          aria-valuemin="0"
        ></div>
        <div class="scale"><span>0</span><span id="bots-max">11</span></div>
      </div>
    </div>
    <div id="killcam"></div>
    <div id="fade"></div>
    <div id="join">
      <button
        id="join-fs"
        class="fs-toggle"
        type="button"
        title="Fullscreen (F)"
        aria-label="Toggle fullscreen"
      >
        <svg class="icon-enter" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="7" y="7" width="10" height="10" stroke-width="1.6" />
          <path d="M3 7V3h4M17 3h4v4M21 17v4h-4M7 21H3v-4" />
        </svg>
        <svg class="icon-exit" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="7" y="7" width="10" height="10" stroke-width="1.6" />
          <path d="M9.6 9.6l4.8 4.8M14.4 9.6l-4.8 4.8" stroke-width="1.6" />
        </svg>
      </button>
      <form id="join-form">
        <h1>ANGELS &amp; BANDITS</h1>
        <input
          id="join-name"
          type="text"
          placeholder="callsign"
          autocomplete="off"
          spellcheck="false"
        />
        <button type="submit">FLY</button>
        <p id="join-status"></p>
      </form>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
