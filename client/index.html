<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Angels &amp; Bandits</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #141225;
        cursor: crosshair;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      canvas {
        display: block;
      }
      #hud {
        position: fixed;
        left: 16px;
        bottom: 14px;
        color: #9fd8e8;
        font-size: 13px;
        line-height: 1.5;
        text-shadow: 0 1px 2px #000;
        user-select: none;
        pointer-events: none;
      }
      #crosshair {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 6px;
        height: 6px;
        margin: -3px 0 0 -3px;
        border: 1px solid #9fd8e8aa;
        border-radius: 50%;
        pointer-events: none;
      }
      #fade {
        position: fixed;
        inset: 0;
        background: #000;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.7s ease-out;
      }
      #fade.dead {
        transition: none;
        opacity: 1;
      }
      #join {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: #141225ee;
        cursor: default;
      }
      #join.open {
        display: flex;
      }
      #join form {
        text-align: center;
        color: #9fd8e8;
      }
      #join h1 {
        font-size: 22px;
        letter-spacing: 0.2em;
        margin: 0 0 18px;
      }
      #join input {
        background: #0c0b18;
        border: 1px solid #27e0c0;
        color: #e8f6fa;
        font: inherit;
        font-size: 16px;
        padding: 10px 14px;
        text-align: center;
        outline: none;
        width: 220px;
      }
      #join button {
        display: block;
        margin: 14px auto 0;
        background: #27e0c0;
        border: none;
        color: #0c0b18;
        font: inherit;
        font-size: 14px;
        letter-spacing: 0.15em;
        padding: 9px 26px;
        cursor: pointer;
      }
      #join-status {
        min-height: 1.2em;
        margin: 12px 0 0;
        font-size: 12px;
        color: #ff7a9a;
      }
    </style>
  </head>
  <body>
    <div id="crosshair"></div>
    <div id="hud"></div>
    <div id="fade"></div>
    <div id="join">
      <form id="join-form">
        <h1>ANGELS &amp; BANDITS</h1>
        <input
          id="join-name"
          type="text"
          placeholder="callsign"
          autocomplete="off"
          spellcheck="false"
        />
        <button type="submit">FLY</button>
        <p id="join-status"></p>
      </form>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
