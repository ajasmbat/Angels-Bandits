<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Angels &amp; Bandits</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #141225;
        cursor: crosshair;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      canvas {
        display: block;
      }
      #hud {
        position: fixed;
        left: 16px;
        bottom: 14px;
        color: #9fd8e8;
        font-size: 13px;
        line-height: 1.5;
        text-shadow: 0 1px 2px #000;
        user-select: none;
        pointer-events: none;
      }
      #crosshair {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 6px;
        height: 6px;
        margin: -3px 0 0 -3px;
        border: 1px solid #9fd8e8aa;
        border-radius: 50%;
        pointer-events: none;
      }
      #fade {
        position: fixed;
        inset: 0;
        background: #000;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.7s ease-out;
      }
      #fade.dead {
        transition: none;
        opacity: 1;
      }
      #crosshair.hit {
        border-color: #ffc46b;
        box-shadow: 0 0 8px #ffc46b;
      }
      #gauges {
        position: fixed;
        right: 16px;
        bottom: 14px;
        width: 180px;
        pointer-events: none;
        user-select: none;
      }
      .gauge {
        margin-top: 8px;
      }
      .gauge label {
        display: block;
        color: #9fd8e8;
        font-size: 10px;
        letter-spacing: 0.15em;
        margin-bottom: 3px;
        text-shadow: 0 1px 2px #000;
      }
      .gauge .bar {
        height: 6px;
        background: #0c0b18cc;
        border: 1px solid #27e0c055;
      }
      .gauge .fill {
        height: 100%;
        width: 100%;
        background: #27e0c0;
        transition: width 0.12s linear;
      }
      #heat-fill {
        background: #ffc46b;
      }
      #heat.locked .fill {
        background: #ff7a9a;
      }
      #heat.locked label {
        color: #ff7a9a;
      }
      #protected-badge {
        display: none;
        color: #9fd8e8;
        font-size: 11px;
        letter-spacing: 0.2em;
        margin-top: 8px;
        text-align: right;
        animation: prot-pulse 0.4s ease-in-out infinite alternate;
      }
      #protected-badge.on {
        display: block;
      }
      @keyframes prot-pulse {
        from {
          opacity: 0.35;
        }
        to {
          opacity: 1;
        }
      }
      #killfeed {
        position: fixed;
        top: 14px;
        right: 16px;
        text-align: right;
        pointer-events: none;
        user-select: none;
        color: #e8f6fa;
        font-size: 13px;
        line-height: 1.7;
        text-shadow: 0 1px 2px #000;
      }
      #killfeed .entry {
        opacity: 1;
        transition: opacity 1s ease-out;
      }
      #killfeed .entry.fading {
        opacity: 0;
      }
      #killfeed .killer {
        color: #27e0c0;
      }
      #killfeed .victim {
        color: #ff7a9a;
      }
      #scoreboard {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        display: none;
        background: #0c0b18e6;
        border: 1px solid #27e0c0;
        color: #e8f6fa;
        padding: 18px 26px;
        min-width: 320px;
        pointer-events: none;
        user-select: none;
      }
      #scoreboard.open {
        display: block;
      }
      #scoreboard h2 {
        margin: 0 0 10px;
        font-size: 13px;
        letter-spacing: 0.25em;
        color: #9fd8e8;
        text-align: center;
      }
      #scoreboard table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      #scoreboard th,
      #scoreboard td {
        padding: 3px 10px;
        text-align: right;
      }
      #scoreboard th:first-child,
      #scoreboard td:first-child {
        text-align: left;
      }
      #scoreboard th {
        color: #9fd8e8;
        font-weight: normal;
        font-size: 10px;
        letter-spacing: 0.15em;
      }
      #scoreboard tr.self td {
        color: #27e0c0;
      }
      #killcam {
        position: fixed;
        left: 50%;
        top: 32%;
        transform: translateX(-50%);
        display: none;
        color: #ff7a9a;
        font-size: 20px;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        text-align: center;
        text-shadow: 0 1px 6px #000;
        pointer-events: none;
        user-select: none;
      }
      #killcam.open {
        display: block;
      }
      #join {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: #141225ee;
        cursor: default;
      }
      #join.open {
        display: flex;
      }
      #join form {
        text-align: center;
        color: #9fd8e8;
      }
      #join h1 {
        font-size: 22px;
        letter-spacing: 0.2em;
        margin: 0 0 18px;
      }
      #join input {
        background: #0c0b18;
        border: 1px solid #27e0c0;
        color: #e8f6fa;
        font: inherit;
        font-size: 16px;
        padding: 10px 14px;
        text-align: center;
        outline: none;
        width: 220px;
      }
      #join button {
        display: block;
        margin: 14px auto 0;
        background: #27e0c0;
        border: none;
        color: #0c0b18;
        font: inherit;
        font-size: 14px;
        letter-spacing: 0.15em;
        padding: 9px 26px;
        cursor: pointer;
      }
      #join-status {
        min-height: 1.2em;
        margin: 12px 0 0;
        font-size: 12px;
        color: #ff7a9a;
      }
      #minimap {
        position: fixed;
        left: 16px;
        top: 14px;
        width: 160px;
        height: 160px;
        border: 1px solid #27e0c055;
        background: #0d0c1a;
        opacity: 0.88;
        pointer-events: none;
        user-select: none;
      }
      .edge-marker {
        position: fixed;
        left: 0;
        top: 0;
        width: 0;
        height: 0;
        border-left: 7px solid transparent;
        border-right: 7px solid transparent;
        border-bottom: 12px solid #ff8a3d;
        filter: drop-shadow(0 0 3px #ff8a3d88);
        pointer-events: none;
        user-select: none;
        will-change: transform;
      }
      #lead {
        position: fixed;
        left: 0;
        top: 0;
        width: 14px;
        height: 14px;
        margin: -7px 0 0 -7px;
        border: 1px solid #ffc46b;
        border-radius: 50%;
        box-shadow: 0 0 6px #ffc46b66;
        display: none;
        pointer-events: none;
        user-select: none;
        will-change: transform;
      }
      #lead::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        width: 2px;
        height: 2px;
        margin: -1px 0 0 -1px;
        background: #ffc46b;
      }
    </style>
  </head>
  <body>
    <div id="crosshair"></div>
    <div id="lead"></div>
    <canvas id="minimap" width="320" height="320"></canvas>
    <div id="hud"></div>
    <div id="gauges">
      <div class="gauge" id="hp">
        <label for="hp-fill">HULL</label>
        <div class="bar"><div class="fill" id="hp-fill"></div></div>
      </div>
      <div class="gauge" id="heat">
        <label for="heat-fill">GUNS</label>
        <div class="bar"><div class="fill" id="heat-fill"></div></div>
      </div>
      <div id="protected-badge">◇ PROTECTED ◇</div>
    </div>
    <div id="killfeed"></div>
    <div id="scoreboard">
      <h2>SCOREBOARD</h2>
      <table>
        <thead>
          <tr><th>PILOT</th><th>KILLS</th><th>DEATHS</th></tr>
        </thead>
        <tbody id="scoreboard-rows"></tbody>
      </table>
    </div>
    <div id="killcam"></div>
    <div id="fade"></div>
    <div id="join">
      <form id="join-form">
        <h1>ANGELS &amp; BANDITS</h1>
        <input
          id="join-name"
          type="text"
          placeholder="callsign"
          autocomplete="off"
          spellcheck="false"
        />
        <button type="submit">FLY</button>
        <p id="join-status"></p>
      </form>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
