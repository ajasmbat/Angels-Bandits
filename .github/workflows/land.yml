name: land-tickets
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
  # Scheduled runs are best-effort on GitHub (they were skipped for hours on
  # 2026-10-12), so also run whenever a ticket PR opens or gets new commits.
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]
concurrency:
  group: land-tickets
  cancel-in-progress: false
permissions:
  contents: write
  pull-requests: write
jobs:
  land:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: superfly/flyctl-actions/setup-flyctl@1.5
      - run: tools/ci/land.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
